<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Amberstar Web</title>
	<style>
		:root { color-scheme: dark; }
		html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; }
		#game { position: fixed; inset: 0; }
		#game canvas { cursor: none; image-rendering: pixelated; }
		#loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; text-align: center; }
		#loader h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: #e8c070; }
		#status { max-width: 560px; line-height: 1.5; }
		#start label { display: inline-block; padding: 10px 18px; border: 1px solid #e8c070; border-radius: 6px; cursor: pointer; color: #e8c070; }
		#start input { display: none; }
		#reset-data { position: fixed; right: 8px; bottom: 8px; z-index: 10; background: transparent; color: #555; border: 1px solid #333; border-radius: 4px; font-size: 11px; cursor: pointer; }
		#reset-data:hover { color: #aaa; }
	</style>
</head>
<body>
	<a href="../index.html" style="position:fixed;top:6px;right:8px;color:#666;font:12px system-ui;text-decoration:none;z-index:2">← game selection</a>
	<div id="loader">
		<h1>AMBERSTAR</h1>
		<div id="status">Loading…</div>
		<div id="start" hidden>
			<label>Choose the Amberfiles folder<input id="dir-input" type="file" webkitdirectory directory multiple></label>
		</div>
	</div>
	<div id="game"></div>
	<button id="reset-data" title="Forget the stored game data">reset data</button>
	<script src="vendor/phaser.min.js"></script>
	<script type="module" src="src/main.js"></script>
</body>
</html>
