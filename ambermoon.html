<!doctype html>
<html lang="en" class="aw-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Ambermoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/host/shell.css">
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
import { AmbermoonHost, fetchDataFolder } from './src/host/ambermoonHost.js';
import { createShell } from './src/host/shell.js';
const shell = createShell({ title: 'Ambermoon', subtitle: 'Ambermoon.net · Web Edition', emblem: 'moon', badge: 'THALION · 1993' });
try {
	const params = new URLSearchParams(location.search);
	shell.progress(0.02, 'Loading game data');
	const files = await fetchDataFolder('data/Ambermoon', (n, total) => shell.progress(0.02 + 0.72 * n / total, 'Loading game data'));
	const host = new AmbermoonHost(shell.canvas, { onError: shell.error, skipIntro: params.has('skipintro'), onExit: () => location.href = 'index.html' });
	window.host = host;
	shell.attach(host);
	await host.start(files, shell.hostStatus);
	await shell.ready();
	// Debug: ?newgame starts a new game right away
	if (params.has('newgame')) {
		const wait = () => new Promise(r => setTimeout(r, 200));
		while (!host.mainMenu) await wait();
		const { MainMenu } = await import('./src/ambermoon/Ambermoon.net/MainMenu.js');
		host.mainMenu.Closed.invoke(MainMenu.CloseAction.NewGame);
	}
} catch (e) {
	shell.fail(e);
}
</script>
</body>
</html>
