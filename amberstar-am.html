<!doctype html>
<html lang="en" class="aw-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Amberstar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/host/shell.css">
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
import { AmbermoonHost, fetchDataFolder } from './src/host/ambermoonHost.js';
import { createShell } from './src/host/shell.js';
const shell = createShell({ title: 'Amberstar', subtitle: 'Remake on the Ambermoon engine', emblem: 'star', badge: 'THALION · 1992' });
try {
	const params = new URLSearchParams(location.search);
	shell.progress(0.02, 'Loading game data');
	// both data folders in parallel, one progress bar
	const counts = [[0, 1], [0, 1]];
	const report = index => (n, total) => {
		counts[index] = [n, total];
		const loaded = counts[0][0] + counts[1][0], all = counts[0][1] + counts[1][1];
		shell.progress(0.02 + 0.68 * loaded / all, 'Loading game data');
	};
	const [amberstarFilesRaw, files, { createAmberstarGameData }] = await Promise.all([
		fetchDataFolder('data/Amberstar', report(0)),
		fetchDataFolder('data/Ambermoon', report(1)),
		import('./src/amberstar/AmberstarGameData.js'),
	]);
	const amberstarFiles = new Map([...amberstarFilesRaw].map(([k, v]) => [k.toUpperCase(), v]));
	const host = new AmbermoonHost(shell.canvas, { onError: shell.error, skipIntro: true, storageName: 'amberstar-on-ambermoon',
		transformGameData: base => { const r = createAmberstarGameData(base, amberstarFiles); window.amberstarContext = r.context; return { gameData: r.gameData, savegameManagerFactory: typeof r.savegameManager === 'function' ? r.savegameManager : null }; }, onExit: () => location.href = 'index.html' });
	window.host = host;
	shell.attach(host);
	await host.start(files, shell.hostStatus);
	await shell.ready();
	// Debug: ?newgame starts a new game right away
	if (params.has('newgame')) {
		const wait = () => new Promise(r => setTimeout(r, 200));
		while (!host.mainMenu) await wait();
		const { MainMenu } = await import('./src/ambermoon/Ambermoon.net/MainMenu.js');
		host.mainMenu.Closed.invoke(MainMenu.CloseAction.NewGame);
	}
} catch (e) {
	shell.fail(e);
}
</script>
</body>
</html>
